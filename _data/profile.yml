ppro:
  employer: PPRO Holdings GmbH
  titles: Senior Platform Engineer, previously Platform Engineer
  place_dates: Munich, Germany. August 2020 to present.
  intro: Developer Enablement team for a global payments provider regulated as an e-money and payment institution. I own internal platform products used by every engineering domain, and I lead projects rather than people.
  projects:
    - id: p-ai
      short: Internal AI platform
      title: Internal AI platform
      lead: true
      start: "2026-03"
      end: present
      when: March 2026 to present
      gist: Designed and led a governed AI platform (model gateway, tool gateway and agent hosting) that connects people and agents to company systems without handing model credentials to teams.
      bullets:
        - Took the MCP tool gateway to general availability with Engineering and Security sign-off. 350+ employees use it through Claude, with OAuth, read-only scoping, human approval for write actions, audit logging, and Amazon Bedrock Guardrails screening tool traffic in both directions for personal data, secrets and prompt injection.
        - Built an OpenAI-compatible model gateway with Bedrock to Vertex AI failover, hashed API keys, per-team model access, per-user daily token budgets and per-request cost attribution in Datadog, which made LLM spend visible and bounded per team.
        - Ran the Claude Enterprise rollout to 350+ seats with Okta SCIM sync, domain groups, a self-serve skills marketplace and a governed intake process for new tool integrations.
        - Built an AI incident-triage agent in Slack that on-call monitors tag automatically for first-line investigation.
        - Launched an agent hosting platform with 3 production agents, including a legal knowledge assistant, with persistent memory and organisation-wide guardrail prompts.
      tags: [Kubernetes, AgentGateway, kagent, Amazon Bedrock, Vertex AI, MCP, Okta, Datadog, Helm, Python]

    - id: p-migration
      short: Gateway migration and data center exit
      title: Payment gateway migration and data center exit
      start: "2024-11"
      end: "2026-02"
      when: November 2024 to February 2026
      gist: Moved a core payment gateway, its services and its databases to a new AWS landing zone with zero downtime, clearing the way to shut down the legacy data center.
      bullets:
        - Migrated 10+ payment gateway services and 5+ production databases from a legacy AWS organisation to a new landing zone with zero downtime.
        - Made every cutover reversible with Helm charts, progressive-delivery promote, abort and rollback pipelines, and weighted DNS traffic shifting. Moved static IPs and set up mTLS on load balancers so merchant-facing endpoints never changed.
        - Contributed to disconnecting the legacy data center in February 2026, with the whole gateway now running on Kubernetes.
      tags: [Kubernetes, Helm, Argo Rollouts, AWS, Terraform, GitHub Actions, Datadog]

    - id: p-security
      short: Secrets, supply chain and access
      title: Secrets, supply chain and production access
      start: "2023-09"
      end: "2025-12"
      when: 2023 to 2025
      gist: Gave every team a standard way to handle secrets, base images and production access, so the secure option became the default one.
      bullets:
        - Built a Keeper to AWS Secrets Manager sync tool as a reusable GitHub Action. It was the company's first standard, auditable way to get secrets into CI/CD and is now used by 70+ AWS accounts across 15+ teams.
        - Created hardened base container images (Chainguard Wolfi, JVM and Node.js, multi-arch, weekly automated rebuilds), now used by ~140 repositories across 9+ domains. In benchmarks they cut known vulnerabilities from 63 to 1.
        - Replaced static cloud credentials with GitHub OIDC, gated production behind GitHub Environments, blocked insecure OIDC subject claims in account vending, and moved automation from personal tokens to GitHub Apps.
      tags: [Keeper, AWS Secrets Manager, GitHub Actions, OIDC, Chainguard, Docker, JFrog Artifactory]

    - id: p-github
      short: GitLab to GitHub adoption
      title: GitLab to GitHub adoption
      lead: true
      start: "2022-10"
      end: "2024-12"
      when: October 2022 to 2024
      gist: Led the company-wide move to GitHub, with governance, identity and self-service built in from the first repository.
      bullets:
        - "Led the programme from proof of concept through enterprise setup, domain onboarding and repository migration: ~200 repositories and 300+ users across 16+ teams and 6+ domains."
        - Set governance from day one: Okta SSO, SCIM and team sync, audit log streaming to Datadog, SonarQube and Jira integrations, an organisation-wide required check that blocks non-compliant repositories, and weekly progress reports to stakeholders.
        - Designed a self-service repository vending tool (Terraform, Terragrunt, GitOps) so teams create repositories that meet branch protection, code ownership and PCI approval rules without waiting on the platform team.
        - Built ephemeral self-hosted runners on AWS ECS for deploying into private VPCs, GKE runners for heavy builds, and a shared library of reusable workflows used across domains.
      tags: [GitHub Actions, Terraform, Terragrunt, Okta, Datadog, AWS, GKE, SonarQube]

    - id: p-cost
      short: Cost and platform modernisation
      title: Cost and platform modernisation
      start: "2024-01"
      end: "2026-06"
      when: 2024 to 2026
      gist: Found savings across cloud and observability spend and helped move the Kubernetes fleet to a cheaper, more flexible compute model.
      bullets:
        - Did the initial research for moving from EKS Fargate to EKS Auto Mode and assisted the migration. The published release projects a 20 to 25% compute cost reduction, with 24 clusters (about a third of the fleet) on Auto Mode at launch.
        - "Found savings across AWS, Datadog and other cloud services: rightsized legacy clusters, retired CI runners and VPN hosts, and moved databases onto reserved-instance coverage."
        - Wrote the proposal for moving infrastructure as code from Terraform to OpenTofu and moved the team's own pipelines over.
      tags: [Kubernetes, AWS, Datadog, OpenTofu, Terraform]

    - id: p-k8s
      short: Kubernetes and CI foundations
      title: Kubernetes platform and CI foundations
      start: "2020-08"
      end: "2022-12"
      when: August 2020 to 2022
      gist: Moved payment services out of the data center onto Kubernetes and kept the cluster fleet, delivery tooling and monitoring current and secure.
      bullets:
        - Migrated 5+ payment gateway services from FreeBSD jails in the data center to Kubernetes on AWS, moving public ingress to network load balancers with static IPs and upgrading TLS to 1.3 with modern ciphers.
        - Kept multi-environment kOps clusters current through Kubernetes and cert-manager upgrades, including the Let's Encrypt root expiry, and CVE fixes for containerd and ingress-nginx.
        - Introduced a shared GitLab CI pipeline library and moved all infrastructure projects onto it. Tuned ArgoCD for a large monorepo and set up Argo Rollouts for progressive delivery.
        - Moved infrastructure monitoring from Prometheus to Datadog and enforced 2FA for every GitLab user.
      tags: [Kubernetes, kOps, ArgoCD, Argo Rollouts, GitLab CI, Datadog, Prometheus, AWS]

  # Items from the previous site not covered by the projects above.
  # Shown only in Full detail mode.
  also:
    title: Also at PPRO
    bullets:
      - "Administered Kubernetes tooling: sealed-secrets, kube2iam, cert-manager, external-dns, ingress controllers and a Prometheus monitoring stack."
      - "Continuous deployment with ArgoCD and Argo Rollouts, supporting multiple deployment strategies."
      - "Designed and maintained Datadog monitoring for apps and services: integrations, monitors and dashboards."
      - "Managed Terraform-based infrastructure as code for AWS, GCP, GitHub, Keeper Secrets Manager and partly Okta."
      - "Provided on-call support and incident remediation."

